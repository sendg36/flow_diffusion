name: acceptance

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (2D teaching version)
        run: g++ -O2 -std=c++17 flow_diffusion_2D/main.cpp -o fem2d
      - name: Run acceptance tests T1-T8
        run: ./fem2d | tee run.log
      - name: Verify all tests passed
        run: grep -q "ALL TESTS PASSED" run.log
